
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mentai</title>

<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-K8DLH8PR"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
</script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #19191f;
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 5;
    border-bottom: 1px solid #30303a;
}

header h1 {
    margin: 0;
    color: #b68cff;
}

.search {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

input, button, select {
    padding: 12px;
    border: none;
    border-radius: 7px;
    font-size: 14px;
}

input, select {
    background: #292932;
    color: white;
    outline: none;
}

.search input {
    width: 250px;
}

button {
    background: #9c65ed;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

button:hover {
    background: #8046d2;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

main {
    padding: 25px 3%;
    width: 100%;
    max-width: none;
    margin: auto;
}

#filterPanel {
    display: none;
    background: #1d1d25;
    padding: 15px;
    border-radius: 10px;
    margin: 15px 0;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
}

#filterPanel input,
#filterPanel select {
    width: 100%;
    min-width: 0;
    border: 1px solid #444;
}

.filter-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

#latest {
    font-size: 24px;
    margin-bottom: 8px;
}

#status {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 20px;
}

#mangaBox {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 18px;
}

.card {
    background: #1d1d25;
    padding: 12px;
    border-radius: 10px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 7px;
    background: #292932;
}

.card h3 {
    font-size: 15px;
    line-height: 1.4;
    min-height: 42px;
    overflow-wrap: anywhere;
}

.card p {
    color: #aaa;
    font-size: 13px;
}

.language {
    display: inline-block;
    background: #383044;
    color: #d6c2ff !important;
    padding: 7px 9px;
    border-radius: 5px;
}

.card button {
    width: 100%;
    min-height: 42px;
}

#pagination {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin: 30px 0;
}

#pagination button {
    min-width: 42px;
    min-height: 42px;
}

#pagination button.active {
    background: white;
    color: #8046d2;
}

#pagination span {
    padding: 8px;
    color: #aaa;
}

/* FULL SCREEN READER */
#reader {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #050507;
    overflow: hidden;
    padding: 0;
    text-align: center;
}

#reader h2 {
    font-size: 16px;
    margin: 5px 0 2px;
    overflow-wrap: anywhere;
    max-height: 38px;
    overflow: hidden;
}

#pageInfo {
    color: #aaa;
    margin: 2px 0;
    font-size: 13px;
}

#loading {
    color: #b68cff;
    margin: 3px 0;
}

/* READING AREA */
.reader-stage {
    position: absolute;
    top: 65px;
    bottom: 65px;
    left: 0;
    right: 0;
    width: 100%;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    background: #050507;
}

/* MANGA IMAGE */
#pageImage {
    display: block;
    width: auto;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    margin: 0 auto;
    transform: scale(1);
    transform-origin: top center;
}

/* READER CONTROLS */
.reader-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    min-height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    padding: 7px;
    background: #111116;
    border-top: 1px solid #30303a;
    z-index: 2;
}

.reader-controls button {
    min-height: 42px;
    min-width: 65px;
}

.zoom-level {
    color: #ccc;
    min-width: 48px;
    font-size: 13px;
}

@media(max-width: 850px) {
    #mangaBox {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
    }

    .card img {
        height: 230px;
    }
}

@media(max-width: 600px) {
    header {
        padding: 13px;
    }

    header h1 {
        font-size: 25px;
    }

    .search {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
    }

    .search input {
        grid-column: 1 / -1;
        width: 100%;
    }

    main {
        padding: 18px 12px;
    }

    #mangaBox {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
    }

    .card {
        padding: 8px;
    }

    .card img {
        height: 220px;
    }

    .card h3 {
        font-size: 13px;
    }

    #filterPanel {
        grid-template-columns: 1fr 1fr;
    }

    #reader h2 {
        font-size: 14px;
    }

    .reader-stage {
        top: 55px;
        bottom: 62px;
    }

    .reader-controls {
        gap: 4px;
        padding: 6px 3px;
    }

    .reader-controls button {
        flex: 1;
        min-width: 0;
        padding: 10px 5px;
        font-size: 12px;
    }

    .zoom-level {
        min-width: 45px;
    }
}

@media(max-width: 360px) {
    .card img {
        height: 185px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Mentai</h1>

    <div class="search">
        <input id="search" placeholder="Search manga...">
        <button id="btn">Search</button>
        <button id="reMake">Random</button>
    </div>
</header>

<main>

    <button id="filterToggle">☰ Filters</button>

    <div id="filterPanel">

        <select id="category">
            <option value="">All Categories</option>
            <option value="doujinshi">Doujinshi</option>
            <option value="manga">Manga</option>
            <option value="artist cg">Artist CG</option>
            <option value="game cg">Game CG</option>
            <option value="western">Western</option>
        </select>

        <input id="tagFilter" placeholder="Tag">
        <input id="artistFilter" placeholder="Artist">
        <input id="characterFilter" placeholder="Character">
        <input id="parodyFilter" placeholder="Parody">
        <input id="groupFilter" placeholder="Group">

        <select id="languageFilter">
            <option value="">All Languages</option>
            <option value="english">English</option>
            <option value="japanese">Japanese</option>
            <option value="chinese">Chinese</option>
        </select>

        <div class="filter-actions">
            <button id="applyFilters">Apply Filters</button>
            <button id="clearFilters">Clear</button>
        </div>

    </div>

    <h2 id="latest">Discover</h2>
    <p id="status">Loading...</p>

    <div id="mangaBox"></div>
    <div id="pagination"></div>

</main>

<!-- READER -->
<div id="reader">

    <h2 id="readerTitle"></h2>
    <p id="pageInfo"></p>
    <p id="loading"></p>

    <div class="reader-stage" id="readerStage">
        <img id="pageImage" alt="Reader page">
    </div>

    <div class="reader-controls">
        <button id="previous">Previous</button>
        <button id="zoomOut">−</button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button id="zoomIn">+</button>
        <button id="zoomReset">Fit</button>
        <button id="next">Next</button>
        <button id="closeReader">Close</button>
    </div>

</div>

<script>
const searchInput = document.getElementById("search");
const mangaBox = document.getElementById("mangaBox");
const statusText = document.getElementById("status");
const pagination = document.getElementById("pagination");

let currentPage = 1;
let randomPageNumber = 1;

let currentReaderPages = [];
let readerPage = 0;
let currentSearch = "";

let currentMode = "random";

let requestNumber = 0;
let readerRequestNumber = 0;

let zoom = 1;

const pageImage = document.getElementById("pageImage");
const readerStage = document.getElementById("readerStage");
const zoomLevel = document.getElementById("zoomLevel");


// FILTER PANEL
document.getElementById("filterToggle").onclick = () => {
    const panel = document.getElementById("filterPanel");

    panel.style.display =
        panel.style.display === "grid" ? "none" : "grid";
};


// BUILD FILTER QUERY
function getFilterQuery() {

    const filters = [
        ["category", "category"],
        ["tagFilter", "tag"],
        ["artistFilter", "artist"],
        ["characterFilter", "character"],
        ["parodyFilter", "parody"],
        ["groupFilter", "group"],
        ["languageFilter", "language"]
    ];

    const terms = [];

    filters.forEach(([id, type]) => {

        const value = document.getElementById(id).value.trim();

        if (value) {
            terms.push(`${type}:"${value}"`);
        }

    });

    return terms.join(" ");
}


// APPLY FILTERS
document.getElementById("applyFilters").onclick = () => {

    currentSearch = getFilterQuery();

    searchInput.value = currentSearch;

    searchManga(currentSearch, 1);

};


// CLEAR FILTERS
document.getElementById("clearFilters").onclick = () => {

    document.querySelectorAll(
        "#filterPanel input, #filterPanel select"
    ).forEach(input => input.value = "");

    currentSearch = "";
    searchInput.value = "";

    searchManga("", 1);

};


// SEARCH
async function searchManga(searched, page = 1) {

    const thisRequest = ++requestNumber;

    currentMode = "search";

    try {

        currentSearch = searched;

        currentPage = Math.max(1, Number(page) || 1);

        statusText.textContent = "Searching...";

        mangaBox.innerHTML = "";
        pagination.innerHTML = "";

        const response = await fetch(
            `/nhentai/v2?searched=${encodeURIComponent(searched)}&page=${currentPage}`
        );

        if (!response.ok) {
            throw new Error("Search failed");
        }

        const data = await response.json();

        if (thisRequest !== requestNumber) return;

        displayManga(data.result || []);

        const perPage = Number(data.per_page) || 24;

        const totalPages = Number(data.num_pages) ||
            Math.ceil((Number(data.total) || 0) / perPage);

        statusText.textContent =
            `${data.total || 0} results found`;

        createPagination(totalPages, currentPage);

    } catch (error) {

        if (thisRequest !== requestNumber) return;

        statusText.textContent = error.message;

    }

}


// DISPLAY CARDS
function displayManga(galleries) {

    mangaBox.innerHTML = "";

    if (!galleries.length) {
        mangaBox.innerHTML = "<p>No results found.</p>";
        return;
    }

    galleries.forEach(manga => {

        const card = document.createElement("div");

        card.className = "card";

        const image = document.createElement("img");

        image.src = manga.photo || "";
        image.alt = manga.title || "Manga cover";
        image.loading = "lazy";

        image.onerror = () => {
            image.removeAttribute("src");
            image.alt = "Image unavailable";
        };

        const title = document.createElement("h3");

        title.textContent = manga.title || "Untitled";

        const pages = document.createElement("p");

        pages.textContent =
            `Pages: ${manga.pages || "Unknown"}`;

        const language = document.createElement("p");

        language.className = "language";

        language.textContent =
            manga.language || "Unknown";

        const read = document.createElement("button");

        read.textContent = "Read";

        read.onclick = () => openManga(manga.id);

        card.append(
            image,
            title,
            pages,
            language,
            read
        );

        mangaBox.appendChild(card);

    });

}


// SEARCH PAGINATION
function createPagination(total, current) {

    pagination.innerHTML = "";

    if (total <= 1) return;

    const addButton = (label, page, active = false) => {

        const button = document.createElement("button");

        button.textContent = label;

        if (active) {
            button.classList.add("active");
        }

        button.onclick = () => {

            if (page < 1 || page > total) return;

            searchManga(currentSearch, page);

        };

        pagination.appendChild(button);

    };

    if (current > 1) {
        addButton("Previous", current - 1);
    }

    const start = Math.max(1, current - 2);
    const end = Math.min(total, current + 2);

    if (start > 1) {

        addButton(1, 1);

        if (start > 2) {

            const dots = document.createElement("span");

            dots.textContent = "...";

            pagination.appendChild(dots);

        }

    }

    for (let i = start; i <= end; i++) {
        addButton(i, i, i === current);
    }

    if (end < total) {

        if (end < total - 1) {

            const dots = document.createElement("span");

            dots.textContent = "...";

            pagination.appendChild(dots);

        }

        addButton(total, total);

    }

    if (current < total) {
        addButton("Next", current + 1);
    }

}


// RANDOM MANGA
async function randomPage(page = 1) {

    const thisRequest = ++requestNumber;

    const randomButton = document.getElementById("reMake");

    currentMode = "random";

    try {

        randomButton.disabled = true;

        statusText.textContent = "Loading random manga...";

        mangaBox.innerHTML = "";
        pagination.innerHTML = "";

        const response = await fetch(
            `/nhentai/random?page=${page}`
        );

        if (!response.ok) {
            throw new Error("Could not load random manga");
        }

        const data = await response.json();

        if (thisRequest !== requestNumber) return;

        randomPageNumber = page;

        displayManga(data.result || []);

        statusText.textContent =
            `${(data.result || []).length} random discoveries`;

        createRandomPagination();

    } catch (error) {

        if (thisRequest !== requestNumber) return;

        statusText.textContent = error.message;

    } finally {

        if (thisRequest === requestNumber) {
            randomButton.disabled = false;
        }

    }

}


// RANDOM HOMEPAGE PAGINATION
function createRandomPagination() {

    pagination.innerHTML = "";

    const addButton = (label, page, active = false) => {

        const button = document.createElement("button");

        button.textContent = label;

        if (active) {
            button.classList.add("active");
        }

        button.onclick = () => randomPage(page);

        pagination.appendChild(button);

    };

    if (randomPageNumber > 1) {
        addButton("Previous", randomPageNumber - 1);
    }

    const start = Math.max(1, randomPageNumber - 2);
    const end = randomPageNumber + 2;

    if (start > 1) {

        addButton(1, 1);

        if (start > 2) {

            const dots = document.createElement("span");

            dots.textContent = "...";

            pagination.appendChild(dots);

        }

    }

    for (let i = start; i <= end; i++) {
        addButton(i, i, i === randomPageNumber);
    }

    addButton("Next", randomPageNumber + 1);

}


// RESET ZOOM
function resetZoom() {

    zoom = 1;

    pageImage.style.transform = "scale(1)";
    pageImage.style.transformOrigin = "top center";

    readerStage.scrollTop = 0;
    readerStage.scrollLeft = 0;

    zoomLevel.textContent = "100%";

}


// UPDATE ZOOM
function updateZoom() {

    zoom = Math.min(4, Math.max(0.5, zoom));

    pageImage.style.transform = `scale(${zoom})`;

    zoomLevel.textContent =
        `${Math.round(zoom * 100)}%`;

}


// ZOOM IN
document.getElementById("zoomIn").onclick = () => {

    zoom += 0.25;

    updateZoom();

};


// ZOOM OUT
document.getElementById("zoomOut").onclick = () => {

    zoom -= 0.25;

    updateZoom();

};


// RESET ZOOM BUTTON
document.getElementById("zoomReset").onclick = () => {
    resetZoom();
};


// PRELOAD NEARBY PAGES
function preloadNearbyPages() {

    const nextPage = currentReaderPages[readerPage + 1];
    const previousPage = currentReaderPages[readerPage - 1];

    [nextPage, previousPage].forEach(page => {

        if (!page || !page.image) return;

        const preload = new Image();

        preload.src = page.image;

    });

}


// OPEN READER
async function openManga(id) {

    const reader = document.getElementById("reader");

    const thisReaderRequest = ++readerRequestNumber;

    reader.style.display = "block";

    currentReaderPages = [];
    readerPage = 0;

    resetZoom();

    document.getElementById("readerTitle").textContent = "Loading...";
    document.getElementById("pageInfo").textContent = "";
    document.getElementById("loading").textContent = "Loading pages...";

    pageImage.style.display = "none";

    try {

        const response = await fetch(
            `/nhentai/read/${encodeURIComponent(id)}`
        );

        if (!response.ok) {
            throw new Error("Could not load manga");
        }

        const data = await response.json();

        if (thisReaderRequest !== readerRequestNumber) return;

        currentReaderPages = data.pages || [];

        readerPage = 0;

        document.getElementById("readerTitle").textContent =
            data.title || "Untitled";

        document.getElementById("loading").textContent = "";

        if (!currentReaderPages.length) {
            throw new Error("No pages available");
        }

        showPage();

    } catch (error) {

        if (thisReaderRequest !== readerRequestNumber) return;

        document.getElementById("loading").textContent =
            error.message;

    }

}


// SHOW READER PAGE
function showPage() {

    const page = currentReaderPages[readerPage];

    if (!page) return;

    resetZoom();

    pageImage.style.display = "block";

    document.getElementById("loading").textContent = "Loading page...";

    pageImage.onload = () => {

        document.getElementById("loading").textContent = "";

        preloadNearbyPages();

    };

    pageImage.onerror = () => {

        pageImage.style.display = "none";

        document.getElementById("loading").textContent =
            "Could not load this page.";

    };

    pageImage.src = page.image;

    document.getElementById("pageInfo").textContent =
        `Page ${readerPage + 1} of ${currentReaderPages.length}`;

    document.getElementById("previous").disabled =
        readerPage === 0;

    document.getElementById("next").disabled =
        readerPage === currentReaderPages.length - 1;

}


// READER CONTROLS
document.getElementById("previous").onclick = () => {

    if (readerPage > 0) {

        readerPage--;

        showPage();

    }

};


document.getElementById("next").onclick = () => {

    if (readerPage < currentReaderPages.length - 1) {

        readerPage++;

        showPage();

    }

};


// CLOSE READER
document.getElementById("closeReader").onclick = () => {

    readerRequestNumber++;

    document.getElementById("reader").style.display = "none";

    pageImage.src = "";

    currentReaderPages = [];
    readerPage = 0;

    resetZoom();

};


// KEYBOARD CONTROLS
document.addEventListener("keydown", event => {

    if (document.getElementById("reader").style.display !== "block") {
        return;
    }

    if (event.key === "ArrowRight") {
        document.getElementById("next").click();
    }

    if (event.key === "ArrowLeft") {
        document.getElementById("previous").click();
    }

    if (event.key === "Escape") {
        document.getElementById("closeReader").click();
    }

    if (event.key === "+" || event.key === "=") {
        zoom += 0.25;
        updateZoom();
    }

    if (event.key === "-") {
        zoom -= 0.25;
        updateZoom();
    }

    if (event.key === "0") {
        resetZoom();
    }

});


// SEARCH BUTTON
document.getElementById("btn").onclick = () => {

    searchManga(searchInput.value.trim(), 1);

};

searchInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        searchManga(searchInput.value.trim(), 1);
    }

});


// RANDOM BUTTON
document.getElementById("reMake").onclick = () => {
    randomPage(1);
};


// INITIAL HOMEPAGE
randomPage(1);

</script>

</body>
</html>
